{% extends "base.html" %}
{% block title %}收货信息{% endblock %}
{% block content %}
<h2>我的收货信息</h2>
<div class="card">
  <h3>新增收货信息</h3>
  <form method="post" class="inline-form">
    <input type="hidden" name="action" value="add">
    <input name="receiver_name" placeholder="收货人" required>
    <input name="phone" placeholder="手机号" required>
    <input name="address_detail" placeholder="收货地址" required size="40">
    <label><input type="checkbox" name="is_default" value="1"> 设为默认</label>
    <button class="btn" type="submit">添加</button>
  </form>
</div>
<table class="data-table">
  <tr><th>收货人</th><th>手机号</th><th>收货地址</th><th>默认</th><th>操作</th></tr>
  {% for a in addresses %}
  <tr>
    <td>{{ a.receiver_name }}</td>
    <td>{{ a.phone }}</td>
    <td>{{ a.address_detail }}</td>
    <td>{% if a.is_default %}<span class="tag-ok">默认</span>{% endif %}</td>
    <td>
      <form method="post" style="display:inline" onsubmit="return confirm('确认删除该收货信息？')">
        <input type="hidden" name="action" value="delete">
        <input type="hidden" name="address_id" value="{{ a.address_id }}">
        <button class="btn-danger" type="submit">删除</button>
      </form>
    </td>
  </tr>
  {% else %}
  <tr><td colspan="5" class="empty">暂无收货信息</td></tr>
  {% endfor %}
</table>
{% endblock %}
