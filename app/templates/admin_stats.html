{% extends "base.html" %}
{% block title %}销售统计{% endblock %}
{% block content %}
<h2>销售情况统计</h2>
<form class="filter-bar" method="get">
  <label>开始 <input type="date" name="start" value="{{ start }}"></label>
  <label>结束 <input type="date" name="end" value="{{ end }}"></label>
  <button class="btn" type="submit">统计</button>
</form>

<div class="stat-summary">
  <div class="stat-box"><div class="stat-num" id="kpi-orders">-</div><div class="stat-label">成交订单数</div></div>
  <div class="stat-box"><div class="stat-num" id="kpi-tickets">-</div><div class="stat-label">售票张数</div></div>
  <div class="stat-box"><div class="stat-num" id="kpi-amount">-</div><div class="stat-label">销售金额(元)</div></div>
</div>

<div class="card"><h3>每日销售趋势（折线图）</h3><div id="chart-daily" style="height:340px"></div></div>
<div class="chart-row">
  <div class="card"><h3>各类型销售额（饼图）</h3><div id="chart-cat" style="height:320px"></div></div>
  <div class="card"><h3>各城市售票数（柱状图）</h3><div id="chart-city" style="height:320px"></div></div>
</div>
<div class="card">
  <h3>热销演出 TOP 10</h3>
  <table class="data-table">
    <tr><th>排名</th><th>演出</th><th>城市</th><th>售票数</th><th>销售额</th></tr>
    <tbody id="top-body"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody>
  </table>
</div>
{% endblock %}

{% block script %}
<script src="{{ url_for('static', filename='lib/echarts.min.js') }}"></script>
<script>
fetch('{{ url_for("admin_stats_data") }}?start={{ start }}&end={{ end }}')
  .then(r => r.json()).then(function(d){
    document.getElementById('kpi-orders').innerText = d.total.orders;
    document.getElementById('kpi-tickets').innerText = d.total.tickets;
    document.getElementById('kpi-amount').innerText = Number(d.total.amount).toLocaleString();

    echarts.init(document.getElementById('chart-daily')).setOption({
      tooltip:{trigger:'axis'},
      legend:{data:['售票张数','销售金额']},
      xAxis:{type:'category', data:d.daily.map(x=>x.d)},
      yAxis:[{type:'value',name:'张数'},{type:'value',name:'金额'}],
      series:[
        {name:'售票张数', type:'line', smooth:true, data:d.daily.map(x=>x.tickets), itemStyle:{color:'#e94b64'}},
        {name:'销售金额', type:'line', yAxisIndex:1, smooth:true, data:d.daily.map(x=>x.amount), itemStyle:{color:'#3b7fff'}}
      ]
    });

    echarts.init(document.getElementById('chart-cat')).setOption({
      tooltip:{trigger:'item', formatter:'{b}: ¥{c} ({d}%)'},
      series:[{type:'pie', radius:['35%','65%'],
        data:d.cats.map(x=>({name:x.name, value:x.amount}))}]
    });

    echarts.init(document.getElementById('chart-city')).setOption({
      tooltip:{trigger:'axis'},
      xAxis:{type:'category', data:d.cities.map(x=>x.name), axisLabel:{rotate:30}},
      yAxis:{type:'value', name:'张数'},
      series:[{type:'bar', data:d.cities.map(x=>x.tickets), itemStyle:{color:'#3b7fff'}}]
    });

    document.getElementById('top-body').innerHTML =
      d.top.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+x.name+'</td><td>'+x.city+
        '</td><td>'+x.tickets+'</td><td>¥'+Number(x.amount).toLocaleString()+'</td></tr>').join('')
      || '<tr><td colspan="5" class="empty">该时段暂无销售数据</td></tr>';
  });
</script>
{% endblock %}
